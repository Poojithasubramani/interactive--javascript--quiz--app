<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> 
</head>
<body>
    <div class="container py-3 quizblock">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card shadow-lg border-0 rounded-4 ">
                    <div class="card-body ">
                        <div class="position-relative text-center">
                            <h2>QuizNova</h2>                 
                            <i class="fs-2">🏆</i>
                            <span id="scoreCard"class="position-absolute top-50 end-0 translate-middle-y bg-info-subtle rounded px-2 py-1">Score:0</span>
                        </div>
                        <p class="text-center text-muted fs-6 mb-3">
                            Question <span id="quizRange">1</span>of 8
                        </p>

                        <hr>

                        <!-- ======show Progress Bar =======-->

                        <div class="progress mb-4" style="height:8px;">
                            <div id="quizProgress" class="progress-bar bg-primary" role="progressbar"style="width:12.5%"></div>
                        </div>
                        <h4 id="quizz" class="mb-4"></h4>
                        
                        <div id="options" class="d-grid gap-2 mb-4">
                            
                            <!-- 4 option buttons will come here dynamically -->                        

                        </div>

                        <div class="d-flex justify-content-end">
                            <button id="nextBtn" class="btn btn-info text-white px-4 py-2 fw-bold" hidden >
                                Next Question
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

                        <!--=========== Quiz Score Card ===========-->

    <div id="scorecontainer" class="container d-none  justify-content-center align-items-center flex-grow-1 my-4" >
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 text-center bg-white">
                
                <!-- Trophy Icon for Header Decoration -->
                <div class="mb-3">
                    <span class="fa-stack fa-2x text-warning">
                        <i class="bi bi-trophy-fill display-1 text-warning">🏆</i>
                    </span>
                </div>

                <!-- Final Score Title -->
                <h2 class="fw-bold text-dark mb-3">Final Score</h2>

                <!-- ======Score Text 40 out of 40 , 8 Question Each Score 5 Marks ======-->
                
                <p id="scored" class="text-muted fs-6 mb-1"></p>
                <h1 class="display-3 fw-bold text-success mb-4"></h1>
                            
                                <!-- Feedback Alert Box For Based on  Score -->

                <div class="alert alert-light border rounded-3 p-3 mb-4 text-start shadow-sm">
                    <div class="d-flex align-items-start">
                        <i class="bi bi-check-circle-fill text-success fs-4 me-2"></i>
                        <div>
                            <strong class="text-dark" id="feedbacktitle"></strong> 
                            <p class="mb-0 text-secondary small"></p>
                        </div>
                    </div> 
                </div>

                <!-- Restart Button -->
                
                <div class="d-grid">
                    <button type="button" id="restartbtn" class="btn btn-warning text-white fw-bold py-3 rounded-pill shadow-sm fs-5">
                        Restart Quiz
                    </button>
                </div>

            </div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
